name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail rather than silently reaching for a different interpreter.
  #
  # This is UV_PYTHON_PREFERENCE, not UV_PYTHON_DOWNLOADS: "only-managed" is not
  # a value the latter accepts, and uv rejects the whole invocation on sight. It
  # made every job fail at whichever uv command came first, which read as a
  # dependency problem and was nothing of the kind.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target; Linux guards against path,
        # line-ending, and default-encoding assumptions.
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pinned to the version this project is developed against. An
          # unpinned action resolves to whatever it defaults to, which for a
          # v5-era action is a uv old enough to reject a revision 3 lockfile
          # and to know nothing about Python 3.14.
          version: "0.10.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # PySide6 links against system OpenGL and xkbcommon even under the
      # offscreen platform. A bare Ubuntu runner has neither, so importing
      # PySide6 fails with "libGL.so.1: cannot open shared object file" and
      # pytest dies with INTERNALERROR before collecting a single test.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3             libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1             libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0             libxcb-xkb1

      - name: Install Python and dependencies
        run: uv sync --group dev --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        # Qt needs an offscreen platform on headless runners.
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q --cov --cov-report=term-missing

  scale:
    name: scale guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pinned to the version this project is developed against. An
          # unpinned action resolves to whatever it defaults to, which for a
          # v5-era action is a uv old enough to reject a revision 3 lockfile
          # and to know nothing about Python 3.14.
          version: "0.10.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # PySide6 links against system OpenGL and xkbcommon even under the
      # offscreen platform. A bare Ubuntu runner has neither, so importing
      # PySide6 fails with "libGL.so.1: cannot open shared object file" and
      # pytest dies with INTERNALERROR before collecting a single test.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3             libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1             libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0             libxcb-xkb1

      - name: Install Python and dependencies
        run: uv sync --group dev --frozen

      # Excluded from the main suite because building the fixture takes ~25 s.
      # They catch the class of bug unit tests structurally cannot: two separate
      # components here were accidentally quadratic and looked fine when small.
      - name: Run scale guards
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -m slow -q

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pinned to the version this project is developed against. An
          # unpinned action resolves to whatever it defaults to, which for a
          # v5-era action is a uv old enough to reject a revision 3 lockfile
          # and to know nothing about Python 3.14.
          version: "0.10.5"
          enable-cache: true

      # Audit the lockfile rather than the environment: --no-emit-project drops
      # our own unpublished package, which pip-audit cannot resolve on PyPI.
      - name: Export pinned dependencies
        run: uv export --group dev --no-emit-project --format requirements-txt -o requirements-audit.txt

      - name: Audit dependencies for known vulnerabilities
        run: uv run --with pip-audit pip-audit --strict -r requirements-audit.txt
